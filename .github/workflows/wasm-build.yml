name: Build and Deploy WASM Game

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      - name: Clone Raylib source
        run: git clone --depth 1 https://github.com/raysan5/raylib.git

      - name: Cache Raylib WASM lib
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: raylib/src/libraylib.web.a
          key: raylib-wasm-v3-${{ runner.os }}

      - name: Build Raylib for WASM
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          cd raylib/src
          make PLATFORM=PLATFORM_WEB -B

      - name: Create dist directory
        run: mkdir -p dist

      - name: Compile Game
        run: |
          emcc -o dist/index.html main.c raylib/src/libraylib.web.a \
            -I. -Iraylib/src \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -s FORCE_FILESYSTEM=1 \
            --embed-file axe_demo.png \
            --preload-file ./sound@sound \
            --shell-file shell.html \
            -DPLATFORM_WEB -O2

      - name: Copy static assets and data bundles
        run: |
          cp index.data dist/ 2>/dev/null || true
          cp axe.png dist/ 2>/dev/null || true
          cp alagard.* dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
