name: Build and Deploy WASM Game

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Emscripten (emcc)
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v3
        with:
          version: 'latest'

      # Download prebuilt Raylib WebAssembly binaries
      - name: Setup Raylib
        uses: raylib-extras/setup-raylib@v1
        with:
          platform: web

      - name: Create dist directory
        run: mkdir -p dist

      # Compile game using the prebuilt libraylib.a from the action
      - name: Compile Game
        run: |
          emcc -o dist/index.html main.c \
            ${{ env.RAYLIB_LIB_PATH }}/libraylib.a \
            -I. -I${{ env.RAYLIB_INCLUDE_PATH }} \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -s FORCE_FILESYSTEM=1 \
            --embed-file axe_demo.png \
            -DPLATFORM_WEB -O2

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4