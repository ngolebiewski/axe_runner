<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Axe Runner</title>
  <meta name="title" content="Axe Runner">
  <meta name="description"
    content="A dwarf, kicked to Hel by Thor, throws axes and dodges spikes trying to escape the dungeon and reach the heart.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Axe Runner">
  <meta property="og:description"
    content="A dwarf, kicked to Hel by Thor, throws axes and dodges spikes trying to escape the dungeon and reach the heart.">
  <meta property="og:image" content="axe.png">

  <link rel="shortcut icon" href="axe.png" type="image/png">

  <style>
    /* Self-hosted Alagard — the gothic pixel font used throughout raylib's
         own text examples. Put alagard.ttf (or .woff2) in the repo root
         next to shell.html for this to actually load; falls back to a
         generic serif until then / if it's missing. */
    @font-face {
      font-family: 'Alagard';
      src: url('alagard.woff2') format('woff2'),
        url('alagard.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0d0b0a;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas.emscripten {
      border: 0px none;
      background-color: #000;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      outline: none;
    }

    canvas.emscripten.hidden {
      display: none;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #241512 0%, #0d0b0a 70%);
      color: #e8c48a;
      text-align: center;
      z-index: 10;
      font-family: 'Trebuchet MS', Verdana, sans-serif;
      cursor: pointer;
    }

    #loading-screen h1 {
      font-family: 'Alagard', 'Trebuchet MS', serif;
      font-size: 2.6rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      color: #d84b2a;
      text-shadow: 0 0 12px rgba(216, 75, 42, 0.6);
      margin-bottom: 0.2em;
    }

    #loading-screen p.tagline {
      color: #b8a184;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 2em;
      max-width: 26em;
      line-height: 1.4em;
    }

    /* The game's own axe sprite, used as the spinner, rendered crisp
         (not blurred) and given a soft glow to match the rest of the UI */
    #axe-spinner {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 1.1s linear infinite;
      filter: drop-shadow(0 0 8px rgba(216, 75, 42, 0.7));
    }

    #axe-spinner img {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      display: block;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #loading-bar-outer {
      width: 240px;
      height: 10px;
      border: 1px solid #6b4b3a;
      border-radius: 6px;
      overflow: hidden;
      background: #1c1310;
      box-shadow: 0 0 8px rgba(216, 75, 42, 0.25);
    }

    #loading-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7a2f1a, #d84b2a);
      box-shadow: 0 0 10px rgba(216, 75, 42, 0.6);
      transition: width 0.15s ease-out;
    }

    #loading-status {
      margin-top: 0.75em;
      font-size: 0.8rem;
      color: #8a7460;
      letter-spacing: 0.05em;
    }

    #start-btn {
      display: none;
      margin-top: 1em;
      padding: 0.6em 1.4em;
      font-family: 'Alagard', 'Trebuchet MS', serif;
      font-size: 1.3rem;
      color: #f7e2bd;
      background: #7a2f1a;
      border: 2px solid #d84b2a;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(216, 75, 42, 0.5);
      animation: pulse 1.5s infinite alternate;
    }

    #start-btn:hover {
      background: #993a20;
      border-color: #f7e2bd;
    }

    @keyframes pulse {
      from { transform: scale(1); box-shadow: 0 0 8px rgba(216, 75, 42, 0.4); }
      to { transform: scale(1.05); box-shadow: 0 0 16px rgba(216, 75, 42, 0.8); }
    }

    #output {
      display: none;
      /* flip to block for on-page debug console */
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 25%;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.8);
      color: #9fdb9f;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 8px;
      box-sizing: border-box;
      z-index: 20;
      white-space: pre-wrap;
    }
  </style>

  <script>
    // --- WebAudio unlock ---------------------------------------------
    // Browsers refuse to let an AudioContext actually run until it's been
    // resumed from inside a real user-gesture handler. raylib's web build
    // (via miniaudio) creates its AudioContext internally the moment the
    // wasm module boots — long before the player has clicked anything —
    // so it comes up "suspended" and stays silent forever unless we
    // explicitly resume it on click/tap.
    //
    // Because we don't have a direct handle into miniaudio's internals,
    // we wrap the AudioContext constructor itself so we capture whatever
    // context gets created, regardless of which backend raylib is using.
    // This MUST run before the emscripten module script (loaded via
    // {{{ SCRIPT }}} at the end of body) so it's in place before that
    // context gets constructed.
    (function () {
      window.__capturedAudioContexts = [];
      var Native = window.AudioContext || window.webkitAudioContext;
      if (Native) {
        window.AudioContext = window.webkitAudioContext = function (...args) {
          var ctx = new Native(...args);
          window.__capturedAudioContexts.push(ctx);
          return ctx;
        };
      }
    })();

    function unlockWebAudio() {
      (window.__capturedAudioContexts || []).forEach(function (ctx) {
        if (ctx.state === 'suspended') ctx.resume();
      });
    }
  </script>
</head>

<body>
  <div id="game-container">
    <div id="loading-screen">
      <div id="axe-spinner"><img src="axe.png" alt=""></div>
      <h1>Axe Runner</h1>
      <p class="tagline">Kicked to Hel by Thor. Dodge the spikes. Don't go splat.</p>
      <div id="loading-bar-outer">
        <div id="loading-bar-inner"></div>
      </div>
      <div id="loading-status">Loading&hellip;</div>
      <button id="start-btn">CLICK TO PLAY</button>
    </div>

    <canvas class="emscripten hidden" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <pre id="output"></pre>

  <script>
    var loadingScreen = document.getElementById('loading-screen');
    var loadingBarOuter = document.getElementById('loading-bar-outer');
    var loadingBarInner = document.getElementById('loading-bar-inner');
    var loadingStatus = document.getElementById('loading-status');
    var startBtn = document.getElementById('start-btn');
    var canvasEl = document.getElementById('canvas');

    var isWasmReady = false;
    var minTimeElapsed = false;
    var isReadyToStart = false;

    // Enforce 2-second minimum animation timeout
    setTimeout(function () {
      minTimeElapsed = true;
      checkLaunchReady();
    }, 2000);

    function checkLaunchReady() {
      if (isWasmReady && minTimeElapsed) {
        isReadyToStart = true;
        loadingBarOuter.style.display = 'none';
        loadingStatus.style.display = 'none';
        startBtn.style.display = 'inline-block';
      }
    }

    function startGame() {
      if (!isReadyToStart) return;

      // Unlocks raylib's WebAudio AudioContext on this explicit click/tap
      // gesture. See the capture shim in <head> — this resumes whatever
      // context miniaudio created internally, whether or not it exists yet.
      unlockWebAudio();

      loadingScreen.style.display = 'none';
      canvasEl.classList.remove('hidden');
      canvasEl.focus();
    }

    // Attach click and touch triggers across the button and loading screen container
    startBtn.addEventListener('click', startGame);
    loadingScreen.addEventListener('click', startGame);
    loadingScreen.addEventListener('touchstart', startGame);

    var Module = {
      print: (function () {
        var element = document.getElementById('output');
        return function (text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
          if (element) {
            element.textContent += text + "\n";
            element.scrollTop = element.scrollHeight;
          }
        };
      })(),
      printErr: function (text) {
        console.error(text);
      },
      canvas: (function () {
        return canvasEl;
      })(),
      setStatus: function (text) {
        if (!text) {
          loadingStatus.textContent = 'Ready';
          return;
        }
        loadingStatus.textContent = text;
        var match = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
        if (match) {
          var pct = (parseInt(match[1]) / parseInt(match[3])) * 100;
          loadingBarInner.style.width = pct + '%';
        }
      },
      monitorRunDependencies: function (left) {
        if (left === 0) {
          loadingBarInner.style.width = '100%';
        }
      },
      onRuntimeInitialized: function () {
        isWasmReady = true;
        checkLaunchReady();
        // Covers the case where the player clicked "CLICK TO PLAY" before
        // the wasm module (and its internal AudioContext) had finished
        // initializing — try the unlock again now that it definitely exists.
        unlockWebAudio();
      }
    };

    window.onerror = function (event) {
      loadingStatus.textContent = 'Something went wrong loading the game — check the console.';
      console.log("Uncaught error:", event);
    };
  </script>
  {{{ SCRIPT }}}
</body>

</html>
